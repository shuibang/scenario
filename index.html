    <style>
      .initial-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        background: #fff;
      }
      .initial-loader__logo {
        width: 48px; height: 48px;
        opacity: 0.85;
      }
      .initial-loader__spinner {
        width: 20px; height: 20px;
        border: 2px solid rgba(0,0,0,0.08);
        border-top-color: rgba(0,0,0,0.4);
        border-radius: 50%;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>이 페이지를 보려면 JavaScript를 사용 설정해 주세요.</noscript>
      <div class="initial-loader" aria-hidden="true">
        <img class="initial-loader__logo" src="/favicon.svg" alt="" width="48" height="48" />
        <div class="initial-loader__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
