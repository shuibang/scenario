<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 구 도메인 redirect — Vercel host 기반 308이 안 잡히는 deployment 구조 대비 폴백. paint 전 동기. -->
    <script>
      (function () {
        if (location.hostname === 'scenario-876h.vercel.app') {
          location.replace('https://daejak.kr' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="작업실" />
    <meta name="theme-color" content="#1B2A4E" />
    <title>대본 작업실 - 쉽게 쓰는 무료 대본 편집기</title>
    <link rel="canonical" href="https://daejak.kr/" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J4KZ1QPJD7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-J4KZ1QPJD7');
    </script>
    <style>
      .initial-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px; padding: 24px; box-sizing: border-box;
        background: #fff;
      }
      .initial-loader__logo {
        width: 100%; max-width: 200px; height: auto;
        animation: initial-loader-float 2s ease-in-out infinite;
        will-change: transform;
      }
      .initial-loader__text {
        margin: 0; font-size: 13px; color: #888888; letter-spacing: 0.02em;
      }
      @keyframes initial-loader-float {
        0%, 100% { transform: translateY(-4px); }
        50%      { transform: translateY(4px); }
      }
      @media (max-width: 600px) {
        .initial-loader__logo { max-width: 60vw; }
        .initial-loader__text { font-size: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader__logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>이 페이지를 보려면 JavaScript를 사용 설정해 주세요.</noscript>
      <div class="initial-loader" aria-hidden="true">
        <img class="initial-loader__logo" src="/logo.svg" alt="" />
        <p class="initial-loader__text">불러오는 중...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
